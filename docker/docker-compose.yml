services:
  postgres:
    image: postgres:latest
    restart: always
    hostname: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - '5438:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes: 
      - ./postgres-data:/var/lib/postgresql
      # copy the sql script to create tables
      - ./sql/10-create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql
      # copy the sql script to fill tables
      - ./sql/20-fill_tables.sql:/docker-entrypoint-initdb.d/fill_tables.sql
  sql-server:
    container_name: sql-server
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "1434:1433"
    environment:
      MSSQL_SA_PASSWORD: "SqlServer-10"
      ACCEPT_EULA: "Y"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  mysql:
      image: mysql:latest
      container_name: mysql
      environment:
        MYSQL_ROOT_PASSWORD: root
      ports:
        - '3307:3306'
      healthcheck:
        test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 30s
      volumes:
        - ./mysql-data:/var/lib/mysql
        - ./mysql/create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql
        - ./mysql/fill_tables.sql:/docker-entrypoint-initdb.d/fill_tables.sql
