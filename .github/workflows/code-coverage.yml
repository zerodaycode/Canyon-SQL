name: Code Coverage

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  code-coverage:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust with coverage tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Start database services
        run: docker compose -f ./docker/docker-compose.yml up --detach --wait --wait-timeout 180

      - name: Initialize SQL Server test data
        run: cargo test initialize_sql_server_docker_instance -p tests --all-features --no-fail-fast -- --show-output --nocapture --include-ignored

      - name: Run tests and generate coverage report
        run: |
          cargo llvm-cov --workspace --all-features --no-fail-fast --html \
            --output-dir target/coverage -- --show-output --test-threads=1

      - name: Stop database services
        if: ${{ always() }}
        run: docker compose -f ./docker/docker-compose.yml down --volumes

      - name: Publish coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: target/coverage
          if-no-files-found: error

      - name: Publish coverage report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/coverage
          token: ${{ secrets.GITHUB_TOKEN }}
