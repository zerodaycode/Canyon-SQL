name: Generate Canyon-SQL release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'

jobs:
  publish:
    name: Publish Canyon-SQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CRATES_IO_TOKEN }}
          publish-delay: 15000
          args: --all-features

  release-publisher:
    needs: 'publish'
    permissions:
      contents: write
      pull-requests: read
    name: Generate a new GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build release notes
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: "./.github/changelog_configuration.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Canyon-SQL release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ contains(github.ref_name, 'rc') }}
